[project]
name = "ripple"
version = "0.1.0"
description = "Ripple: a graph-native supply chain control tower on FalkorDB"
requires-python = ">=3.12,<3.14"
dependencies = [
  "falkordb>=1.8.0",
  "falkordblite>=0.10.0",
  "fastmcp>=4.1.0",
  "fastapi>=0.143.0",
  "uvicorn>=0.30",
  "sse-starlette>=3.5.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "numpy>=2.0",
  "faker>=30",
  "pyyaml>=6.0",
  "anthropic>=1.14.0",
  "langgraph>=1.2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
memory = ["graphiti-core[falkordb]>=0.30.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ripple"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: builds the full DataCo dataset (run with -m slow)"]
addopts = "-m 'not slow' -p no:cacheprovider"
