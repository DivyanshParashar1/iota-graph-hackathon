[project]
name = "ripple"
version = "0.1.0"
description = "Ripple: agentic onboarding and a per-tenant supply chain brain on FalkorDB"
requires-python = ">=3.12,<3.14"
dependencies = [
  "falkordb>=1.8.0",
  "falkordblite>=0.10.0",
  "fastapi>=0.143.0",
  "uvicorn>=0.30",
  "sse-starlette>=3.5.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "anthropic>=1.14.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ripple"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "llm: calls a real LLM provider (run with -m llm; needs the `claude` CLI login or a key)",
  "slow: takes more than a few seconds (run with -m slow)",
]
addopts = "-m 'not slow and not llm' -p no:cacheprovider"
