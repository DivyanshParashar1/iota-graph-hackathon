# FalkorDB server (with the FalkorDB Browser on :3000) + the Ripple API/UI in remote mode.
# Starts empty: a tenant is created when a company starts onboarding at http://localhost:8000.
# Secrets and keys come from .env (copy .env.example). FalkorDB requires a password: the server is started with
# --requirepass $FALKORDB_PASSWORD and Ripple connects as the Redis "default" user. In the Browser, log in with
# host falkordb (or localhost), port 6379, username default and that password.
services:
  falkordb:
    image: falkordb/falkordb:v4.18.3   # pinned: latest (Rust server) panicked on a build query, see docs/KNOWN_ISSUES.md
    environment:  # only DB and Browser secrets: the DB container never sees the LLM keys
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD in .env}
      REDIS_ARGS: "--requirepass ${FALKORDB_PASSWORD}"
      # the Browser stores the login session encrypted; without these, password logins are rejected
      ENCRYPTION_KEY: ${FALKORDB_BROWSER_ENCRYPTION_KEY:?set FALKORDB_BROWSER_ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      NEXTAUTH_SECRET: ${FALKORDB_BROWSER_NEXTAUTH_SECRET:?set FALKORDB_BROWSER_NEXTAUTH_SECRET in .env (openssl rand -hex 32)}
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$FALKORDB_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    depends_on:
      falkordb:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:  # wins over .env
      RIPPLE_DB_MODE: remote
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_USERNAME: ${FALKORDB_USERNAME:-default}
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD}
      RIPPLE_TENANTS_DIR: /app/var/tenants
      # RIPPLE_LLM_PROVIDER=claude_code (the default): the container has no `claude` CLI, so it calls the host
      # bridge, which runs Claude Code on the host's login. Start it first:
      #   .venv/bin/python -m ripple.claude_code_bridge
      # With a key instead, set RIPPLE_LLM_PROVIDER=openrouter and OPENROUTER_API_KEY in .env.
      CLAUDE_CODE_BRIDGE_URL: ${CLAUDE_CODE_BRIDGE_URL:-http://host.docker.internal:8765}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Docker Desktop has it already; this covers Linux
    ports:
      - "8000:8000"
    volumes:
      - ripple-var:/app/var   # each tenant's uploads and exported expert prompts
volumes:
  falkordb-data:
  ripple-var:
