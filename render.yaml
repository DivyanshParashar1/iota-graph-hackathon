# Render blueprint: one web service (API + UI) with embedded FalkorDB on a persistent disk.
# For FalkorDB Cloud instead: set RIPPLE_DB_MODE=remote and FALKORDB_HOST/PORT/USERNAME/PASSWORD.
# Not run in the build session: see docs/KNOWN_ISSUES.md.
services:
  - type: web
    name: ripple
    runtime: docker
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: RIPPLE_DB_MODE
        value: embedded
      - key: RIPPLE_DB_PATH
        value: /app/var/ripple.db
      - key: RIPPLE_TENANTS_DIR
        value: /app/var/tenants
      # There is no `claude` CLI in a Render container, so a hosted deploy needs an API key.
      - key: RIPPLE_LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
    disk:
      name: ripple-data
      mountPath: /app/var
      sizeGB: 2
